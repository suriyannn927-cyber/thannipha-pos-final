<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS ร้านธัญญ์นิภาค้าข้าว</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>🌾 ระบบ POS ร้านธัญญ์นิภาค้าข้าว</h1>
    </div>
    <div class="container">
        <!-- ฝั่งรายการสินค้า -->
        <div class="products-section">
            <h2>📦 รายการสินค้า</h2>
            <div id="product-list" class="grid"></div>
        </div>
        
        <!-- ฝั่งตะกร้าและคิดเงิน -->
        <div class="cart-section">
            <h2>🛒 บิลชำระเงิน</h2>
            <ul id="cart-list"></ul>
            <div class="total-box">
                <h3>ยอดรวม: <span id="total-price">0</span> บาท</h3>
                <button id="checkout-btn" onclick="checkout()">ชำระเงิน</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
